[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "emby-playback-guardian"
dynamic = ["version"]
description = "Protect Emby and Jellyfin playback by coordinating background tasks and download clients"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "wolffcatskyy"}]
keywords = ["emby", "jellyfin", "playback", "homelab"]
dependencies = ["requests>=2.28.0", "psutil>=5.9.0"]

[project.urls]
Repository = "https://github.com/wolffcatskyy/emby-playback-guardian"
Issues = "https://github.com/wolffcatskyy/emby-playback-guardian/issues"

[project.scripts]
emby-playback-guardian = "guardian:main"

[tool.setuptools]
py-modules = ["guardian"]

[tool.setuptools.dynamic]
version = {attr = "guardian.__version__"}
